# CodeQL (security review, 2026-09-29): GitHub's code scanner looks for injection, unsafe redirects,
# cross-site scripting, leaked data flows and similar in our TypeScript. Results appear in the
# repository's Security tab. Runs on pushes, pull requests and every Monday.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          category: /language:javascript-typescript
