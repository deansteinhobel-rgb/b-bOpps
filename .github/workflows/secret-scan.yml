# Gitleaks (security review, 2026-09-29): scans every commit, including old history, for keys and
# tokens (Anthropic, Supabase, Notion, Windsor, JWTs...). Fails the run if it finds one; the report
# shows where, with the secret redacted. Runs the Gitleaks binary directly (the GitHub Action needs a
# licence for organisation repositories).
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:latest \
            git --config /repo/.gitleaks.toml --redact --verbose --exit-code 1 /repo
