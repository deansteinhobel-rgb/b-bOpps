# Checks on every push and pull request: types, lint, unit tests, the offline database access tests
# (in-memory Postgres; never touches the real project) and known vulnerabilities in the packages the
# app ships. No secrets are needed or used.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Database access tests (RLS)
        run: pnpm test:db
      - name: Known vulnerabilities (high and critical fail the build)
        run: pnpm audit --prod --audit-level high
