# Checks on every push and pull request: types, lint, unit tests, the offline database access tests
# (in-memory Postgres; never touches the real project) and known vulnerabilities in the packages the
# app ships. No secrets are needed or used.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Database access tests (RLS)
        run: pnpm test:db
      - name: Known vulnerabilities (high and critical fail the build)
        run: pnpm audit --prod --audit-level high
